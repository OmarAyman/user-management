# Serves the built SPA and proxies the API through the same origin.
#
# One origin is the point, not a convenience: the refresh token is an httpOnly cookie, and same-origin means it
# is sent without CORS credentials negotiation or a SameSite exemption - the same arrangement the dev server's
# proxy gives, so the containerised stack behaves like the local one.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived hashed assets, short-lived index.html: the build hashes filenames, so anything with a hash can
    # be cached hard, while the entry document must not be or a deploy would never reach a returning visitor.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API ignores X-Forwarded-For unless a deployment names the proxy it trusts, so by default the
        # audited client address is this container's. Set ForwardedHeaders__KnownNetworks__0 on the api service
        # to make it believe the header - see the README.
    }

    # Health is proxied so a reviewer can reach it on the same port as the interface.
    location = /health {
        proxy_pass http://api:8080/health;
    }

    # Client-side routing: an unknown path is an Angular route, not a missing file. This must come last.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
