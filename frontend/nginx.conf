# Serves the built SPA and proxies the API through the same origin.
#
# One origin is the point, not a convenience: the refresh token is an httpOnly cookie, and same-origin means it
# is sent without CORS credentials negotiation or a SameSite exemption - the same arrangement the dev server's
# proxy gives, so the containerised stack behaves like the local one.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version. It is free reconnaissance.
    server_tokens off;

    # Security headers live on the locations that serve the document, not on the server block. Set here they
    # would also be appended to every proxied API response, which already carries its own - two
    # Content-Security-Policy headers on one response are combined by intersection, and a duplicated
    # X-Frame-Options is ignored outright by some browsers. So each surface gets exactly one set: the API's
    # from the API, the page's from here.

    # Long-lived hashed assets, short-lived index.html: the build hashes filenames, so anything with a hash can
    # be cached hard, while the entry document must not be or a deploy would never reach a returning visitor.
    #
    # A caution about add_header in nginx: a location that declares any add_header of its own discards every
    # inherited one. So the security headers are repeated in each location that sets a Cache-Control, rather
    # than silently dropped there.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    #
    # The document headers, in one place and repeated only where nginx forces it. `script-src 'self'` has no
    # exemption and there is no third-party origin in the policy at all - which is possible because the fonts
    # are bundled. Two things had to change for that: Angular's inlineCritical rewrites the stylesheet link
    # with onload="this.media='all'", an inline handler this policy blocks, so it is off in the production
    # build; and the Google Fonts links are gone from index.html.
    #
    # 'unsafe-inline' for styles is not laziness - Angular Material injects component styles as <style>
    # elements at runtime, so a strict style-src breaks every dialog and form field.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API ignores X-Forwarded-For unless a deployment names the proxy it trusts, so by default the
        # audited client address is this container's. Set ForwardedHeaders__KnownNetworks__0 on the api service
        # to make it believe the header - see the README.
    }

    # Health is proxied so a reviewer can reach it on the same port as the interface.
    location = /health {
        proxy_pass http://api:8080/health;
    }

    # Client-side routing: an unknown path is an Angular route, not a missing file. This must come last.
    #
    # try_files serves index.html without re-entering the `= /index.html` location, so the headers are set
    # again here. Miss this and every deep link - /users, /profile, /audit - is served with no policy at all,
    # while a request for / looks perfectly protected.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        try_files $uri $uri/ /index.html;
    }
}
