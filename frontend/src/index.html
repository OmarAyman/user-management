<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>User Management</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      lang and dir start as en/ltr and are replaced by LocaleService before the first paint, so an Arabic user
      does not see a left-to-right flash.
    -->
    <!--
      Roboto and the Material icon font are bundled, not fetched from Google. Three reasons, in order of
      weight: on a network that cannot reach fonts.gstatic.com every icon renders as its own ligature text -
      "visibility", "delete", "edit" - which is a broken interface, not a degraded one; a strict
      Content-Security-Policy on the page needs no third-party exemption; and nothing about the interface
      changes if a CDN is slow or gone.
    -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
